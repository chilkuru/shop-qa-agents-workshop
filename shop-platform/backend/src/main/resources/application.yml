# =============================================================================
# 12-factor configuration. EVERY value is overridable by an environment variable
# so the same artifact runs on a laptop, in Docker, or on ECS/App Service/Cloud Run
# with config changes only.
#
# NEVER hardcode localhost, ports, secrets or origins below.
# =============================================================================

server:
  # Cloud Run / App Service assign the port at runtime.
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: shop-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DATABASE_USER:shop}
    password: ${DATABASE_PASSWORD:shop}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

shop:
  auth:
    # MUST be overridden in any non-local environment.
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-min-32-bytes!}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  test-support:
    # Guards the test-only seed/reset endpoints. Only active under the `test` profile.
    token: ${TEST_SUPPORT_TOKEN:local-test-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    persist-authorization: true
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.shop: ${LOG_LEVEL_APP:INFO}
